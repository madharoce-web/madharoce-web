name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none

      # La cuenta original (2022) fue robada; mostrar la fecha real de alta
      - uses: actions/checkout@v4
      - name: Corregir "Joined GitHub" y publicar
        run: |
          YEARS=$(( $(date +%Y) - 2022 ))
          F=/metrics_renders/github-metrics.svg
          # Sumar lo que no se pudo traer de la cuenta antigua (MigueldeHaroce)
          num() { grep -oE "$1" "$F" | grep -oE '[0-9]+' | head -1; }
          FOL=$(( $(num 'Followed by [0-9]+') + 3 ))
          STA=$(( $(num '[0-9]+ Stargazers?') + 3 ))
          WAT=$(( $(num '[0-9]+ Watchers?') + 15 ))
          sed -E \
            -e "s/Joined GitHub [^<]*ago/Joined GitHub ${YEARS} years ago/" \
            -e "s/Followed by [0-9]+ users?/Followed by ${FOL} users/" \
            -e "s/[0-9]+ Stargazers?/${STA} Stargazers/" \
            -e "s/[0-9]+ Watchers?/${WAT} Watchers/" \
            "$F" > github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || (git commit -m "Update github-metrics.svg - [Skip GitHub Action]" && git push)
